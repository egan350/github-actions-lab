
name: Hello GitHub Actions

on:
  push:
  pull_request:

strategy:
  matrix:
    python-version: ['3.10', '3.11', '3.12']

jobs:
  hello:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytest
        run: python -m pip install pytest

      - name: Run tests
        run: python -m pytest
